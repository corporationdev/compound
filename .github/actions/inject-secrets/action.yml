name: Inject secrets
description: Resolve stage-scoped 1Password credentials into private app env files
inputs:
  stage:
    required: true
    description: Deployment stage
  op-service-account-token:
    required: true
    description: 1Password service account token
runs:
  using: composite
  steps:
    - uses: 1password/install-cli-action@v1
    - shell: bash
      env:
        COMPOUND_STAGE: ${{ inputs.stage }}
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}
      run: bun run secrets:inject --stage "$COMPOUND_STAGE"
