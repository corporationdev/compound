name: Setup
description: Install the Compound toolchain and locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11
    - run: bun install --frozen-lockfile
      shell: bash
