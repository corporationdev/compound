name: Preview stage
description: Derive the same branch-based stage for deployment and teardown
inputs:
  branch:
    required: true
    description: Pull request head branch
outputs:
  stage:
    description: Compound preview stage
    value: ${{ steps.stage.outputs.stage }}
runs:
  using: composite
  steps:
    - id: stage
      shell: bash
      env:
        PREVIEW_BRANCH: ${{ inputs.branch }}
      run: bun scripts/preview-stage.ts
