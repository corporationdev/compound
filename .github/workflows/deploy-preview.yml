name: Deploy Preview
on:
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: preview-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' && github.actor != 'dependabot[bot]'
    environment: Preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/preview-stage
        with:
          branch: ${{ github.event.pull_request.head.ref }}
      - name: Check whether this revision is still current
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('deploy', pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha);
      - name: Check
        if: steps.current.outputs.deploy == 'true'
        run: bun run check && bun run test:cloud && bun test scripts/preview.test.ts
      - name: Inject preview secrets
        if: steps.current.outputs.deploy == 'true'
        uses: ./.github/actions/inject-secrets
        with:
          stage: ${{ env.STAGE }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Deploy Convex preview and Alchemy
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        run: bun run deploy --stage "$STAGE"
      - name: Update preview status
        if: always() && steps.current.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compound-preview -->';
            const success = process.env.DEPLOY_RESULT === 'success';
            const config = success ? JSON.parse(fs.readFileSync('apps/desktop/runtime-config.json', 'utf8')) : null;
            const server = config?.serverUrl;
            const web = server?.replace('://server-', '://app-');
            const logs = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [marker, `## Preview deployment ${success ? 'ready' : 'failed'}`, '', `Stage: \`${process.env.STAGE}\``, '', ...(success ? [`[Web preview](${web}) · [API health](${server}/health)`, '', 'Project-folder editing requires the desktop app. Preview data is preserved across updates until teardown or Convex expiry.'] : []), '', `[Deployment logs](${logs})`].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
