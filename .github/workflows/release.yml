name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
concurrency:
  group: desktop-production-release
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Require main for a new release
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: github.event_name == 'workflow_dispatch'
      - name: Prepare release version
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Re-running this workflow must reuse its version, even if main has advanced.
            tag="$(git for-each-ref --format='%(refname:short)|%(contents:subject)' refs/tags | awk -F'|' -v subject="Release workflow $GITHUB_RUN_ID" '$2 == subject { print $1 }')"
            if [ -z "$tag" ]; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              bun run release "$RELEASE_BUMP"
              tag="$(git describe --tags --exact-match HEAD)"
              git tag --force --annotate "$tag" --message "Release workflow $GITHUB_RUN_ID"
              # Fail without publishing either ref if main changed while preparing the release.
              git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
            fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  publish-macos:
    needs: prepare-release
    runs-on: macos-latest
    environment: prod
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check versions match tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="${RELEASE_TAG#v}"
          for PKG in package.json apps/desktop/package.json apps/cli/package.json apps/web/package.json; do
            V="$(node -p "require('./$PKG').version")"
            if [ "$V" != "$TAG" ]; then
              echo "Version mismatch in $PKG: $V, tag is $TAG"
              exit 1
            fi
          done
      - name: Check
        run: bun run check && bunx tsc -p apps/web/tsconfig.node.json --noEmit && bun run test:cloud && bun run --cwd apps/landing test
      - name: Derive public production config
        run: bun scripts/release-env.ts
      - name: Load Apple release credentials
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MACOS_CERT_P12: op://compound-prod/Apple/certificate
          MACOS_CERT_PASSWORD: op://compound-prod/Apple/certificate-password
          APPLE_API_KEY_BASE64: op://compound-prod/Apple/api-key
          APPLE_API_KEY_ID: op://compound-prod/Apple/api-key-id
          APPLE_API_ISSUER: op://compound-prod/Apple/api-issuer
          APPLE_TEAM_ID: op://compound-prod/Apple/team-id
      - name: Prepare signing keychain and validate Apple access
        run: bun scripts/release-signing.ts
      - name: Stage chat runtime
        run: bun run --cwd apps/desktop stage:chat
      - name: Compile desktop
        # The Check step already typechecked the desktop workspace.
        run: bun run --cwd apps/desktop build:main && bun run --cwd apps/desktop build:preload && bun run --cwd apps/desktop build:native
      - name: Build desktop web UI
        run: bun run --cwd apps/web bundle:desktop
      - name: Stage CLI, docs, and skills
        run: bun run --cwd apps/desktop stage:cli && bun run --cwd apps/desktop stage:docs && bun run --cwd apps/desktop stage:skills
      - name: Package, sign, notarize, and make installers
        env:
          DEBUG: electron-universal
        run: bun run --cwd apps/desktop electron-forge make --arch=universal
      - name: Verify signature, notarization, architectures, and bundled CLI
        run: bun scripts/release-artifacts.ts
      - name: Save verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compound-mac-universal
          path: .generated/release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .generated/release/*.dmg .generated/release/*.zip .generated/release/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Load installer storage credentials
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://compound-prod/Cloudflare/account-id
          R2_ACCESS_KEY_ID: op://compound-prod/R2/access-key-id
          R2_SECRET_ACCESS_KEY: op://compound-prod/R2/secret-access-key
      - name: Publish the public download
        run: bun scripts/release-publish.ts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Clean up signing credentials
        if: always()
        run: bun scripts/release-signing-cleanup.ts
