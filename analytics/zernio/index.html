<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zernio posts · Isaac Dyor</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.05);
    --ig: #2a78d6; --tt: #eb6834; --s3: #1baf7a; --s4: #eda100; --gray: #c3c2b7;
    --seq-1:#cde2fb; --seq-2:#b7d3f6; --seq-3:#9ec5f4; --seq-4:#86b6ef; --seq-5:#6da7ec; --seq-6:#5598e7; --seq-7:#3987e5; --seq-8:#2a78d6; --seq-9:#256abf; --seq-10:#1c5cab; --seq-11:#184f95; --seq-12:#104281; --seq-13:#0d366b;
    --good:#006300; --bad:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
      --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
      --ig:#3987e5; --tt:#d95926; --s3:#199e70; --s4:#c98500; --gray:#4a4a47;
      --good:#0ca30c; --bad:#e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
    --ig:#3987e5; --tt:#d95926; --s3:#199e70; --s4:#c98500; --gray:#4a4a47;
    --good:#0ca30c; --bad:#e66767;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  header { padding: 20px 28px 8px; display:flex; align-items:flex-end; justify-content:space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .avatars { display:flex; gap: 10px; align-items:center; }
  .avatars img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; }
  .avatar { display:flex; align-items:center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .avatar b { color: var(--ink); font-weight: 600; }
  .filters { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 28px; display:flex; gap: 8px; flex-wrap: wrap; align-items:center; border-bottom: 1px solid var(--border); }
  .seg { display:inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow:hidden; background: var(--surface); }
  .seg button { border:0; background: transparent; padding: 6px 10px; font: inherit; color: var(--ink-2); cursor:pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--hover); }
  .filters label { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .filters input[type=date], .filters select { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .filters .spacer { flex: 1; }
  main { padding: 16px 28px 60px; display:grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  section.group { grid-column: 1 / -1; margin-top: 12px; }
  section.group h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  section.group p { margin:0; color: var(--ink-2); font-size: 13px; }
  .card { grid-column: span 6; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; display:flex; flex-direction: column; }
  .card.w4 { grid-column: span 4; } .card.w3 { grid-column: span 3; } .card.w12 { grid-column: span 12; } .card.w8 { grid-column: span 8; }
  @media (max-width: 1100px) { .card, .card.w4, .card.w3, .card.w8 { grid-column: span 6; } }
  @media (max-width: 720px) { .card, .card.w4, .card.w3, .card.w8, .card.w12 { grid-column: 1 / -1; } }
  .card-head { display:flex; align-items:flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card h3 { margin:0; font-size: 13.5px; font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .card .tools { display:flex; gap: 4px; flex-shrink:0; }
  .card .tools button { border: 1px solid var(--border); background: transparent; color: var(--ink-2); font: inherit; font-size: 11px; padding: 2px 7px; border-radius: 6px; cursor:pointer; }
  .card .tools button:hover { background: var(--hover); }
  .card .tools button[aria-pressed="true"] { color: var(--ink); background: var(--hover); }
  .card .body { flex: 1; min-height: 0; }
  .legend { display:flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
  .legend span { display:inline-flex; align-items:center; gap: 6px; }
  .legend i { display:inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .legend i.line { height: 2px; width: 14px; border-radius: 1px; }
  svg { display:block; width: 100%; height: auto; overflow: visible; font: 11px system-ui, -apple-system, sans-serif; }
  svg text { fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg .grid line { stroke: var(--grid); stroke-width: 1; }
  svg .axis line, svg .axis path { stroke: var(--axis); stroke-width: 1; fill:none; }
  svg .mark:hover, svg .mark:focus { filter: brightness(1.12); outline: none; }
  svg .hit { fill: transparent; stroke: none; pointer-events: all; }
  svg .crosshair { stroke: var(--axis); stroke-width: 1; pointer-events:none; }
  svg .dlabel { fill: var(--ink-2); font-size: 11px; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); max-width: 320px; display:none; color: var(--ink); }
  #tip .t { color: var(--muted); margin-bottom: 4px; font-size: 11px; }
  #tip .row { display:flex; gap: 8px; align-items:center; justify-content: space-between; }
  #tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #tip .row .k { color: var(--ink-2); display:inline-flex; align-items:center; gap: 6px; }
  #tip .row .k i { width: 12px; height: 2px; display:inline-block; }
  #tip img { width: 100%; border-radius: 6px; margin-bottom: 6px; max-height: 160px; object-fit: cover; }
  .kpis { grid-column: 1 / -1; display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .tile .l { font-size: 12px; color: var(--ink-2); }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
  .tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile .d.up { color: var(--good); } .tile .d.down { color: var(--bad); }
  .tile svg { margin-top: 6px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
  table.tbl th { color: var(--muted); font-weight: 500; font-size: 11.5px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  table.tbl th[aria-sort="descending"]::after { content: " ↓"; } table.tbl th[aria-sort="ascending"]::after { content: " ↑"; }
  table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.tbl td.cap { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  table.tbl tr:hover td { background: var(--hover); }
  table.tbl img.th { width: 28px; height: 36px; object-fit: cover; border-radius: 4px; vertical-align: middle; background: var(--grid); }
  .tablewrap { max-height: 420px; overflow: auto; }
  .pill { display:inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); }
  .pill i { display:inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .card .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); font-size: 12px; padding: 30px 0; text-align:center; }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #detail { position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(0,0,0,0.12); z-index: 40; overflow:auto; padding: 16px 18px; transform: translateX(100%); transition: transform .18s ease; }
  #detail.open { transform: none; }
  #detail .close { position: absolute; top: 10px; right: 12px; border: 0; background: transparent; font-size: 18px; cursor: pointer; color: var(--ink-2); }
  #detail h3 { margin: 0 0 4px; font-size: 14px; padding-right: 30px; }
  #detail .meta { color: var(--ink-2); font-size: 12px; margin-bottom: 8px; }
  #detail .thumb { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; background: var(--grid); }
  #detail dl { display:grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; margin: 10px 0; }
  #detail dt { color: var(--muted); } #detail dd { margin:0; font-variant-numeric: tabular-nums; }
  #detail pre { font-size: 11px; background: var(--page); padding: 8px; border-radius: 6px; overflow:auto; max-height: 240px; }
  .stack { display:flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div id="tip"></div>
<aside id="detail"><button class="close" aria-label="Close">×</button><div id="detail-body"></div></aside>
<header>
  <div>
    <h1>Zernio posts</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="avatars" id="accounts"></div>
</header>
<div class="filters" id="filters"></div>
<main id="main"></main>
<script src="data/dataset.js"></script>
<script>
(() => {
const D = window.ZERNIO_DATA;
const TZ = 'America/Los_Angeles';
const PLAT = { instagram: { name: 'Instagram', color: 'var(--ig)' }, tiktok: { name: 'TikTok', color: 'var(--tt)' } };
const METRICS = {
  views: 'Views', likes: 'Likes', comments: 'Comments', shares: 'Shares', saves: 'Saves', engagement: 'Engagement (L+C+S+S)',
  engagementRate: 'Engagement rate %', reach: 'Reach (IG)', igReelsAvgWatchTime: 'Avg watch time ms (IG)', reelsSkipRate: 'Skip rate % (IG)',
};
const fmt = (n, d = 0) => n == null || Number.isNaN(n) ? '–' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d });
const compact = (n) => n == null ? '–' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.abs(n) >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : Math.abs(n) >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : fmt(n, 1);
const dayKey = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
const localParts = (iso) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', hour: 'numeric', hour12: false }).formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  return { weekday: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), hour: Number(p.hour) % 24 };
};
const shortDate = (iso) => iso ? new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' }).format(new Date(iso)) : '–';
const fullDate = (iso) => iso ? new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)) : '–';
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, ...kids) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};

// ---------- posts enrichment
const posts = D.posts.map((p) => {
  const lp = p.publishedAt ? localParts(p.publishedAt) : { weekday: null, hour: null };
  const m = p.metrics;
  const dur = m.videoDurationSeconds;
  const retention = p.platform === 'instagram' && dur && m.igReelsAvgWatchTime ? m.igReelsAvgWatchTime / 1000 / dur : null;
  const tl = p.timeline;
  const gain7 = tl.length >= 2 ? Object.fromEntries(['views','likes','comments','shares','saves'].map((k) => [k, (tl[tl.length-1][k] ?? 0) - (tl[0][k] ?? 0)])) : null;
  return { ...p, day: p.publishedAt ? dayKey(p.publishedAt) : null, lweekday: lp.weekday, lhour: lp.hour, retention, gain7, er: m.engagementRate,
    v: { ...m, engagement: p.engagement } };
});
const byId = new Map(posts.map((p) => [p.id, p]));
const zernioGroups = new Map();
for (const p of posts) if (p.zernioPostId) { const g = zernioGroups.get(p.zernioPostId) ?? {}; g[p.platform] = p; zernioGroups.set(p.zernioPostId, g); }

// ---------- state
const allDays = posts.map((p) => p.day).filter(Boolean).sort();
const state = { from: '2026-08-13', to: allDays[allDays.length - 1], platform: 'all', source: 'all', metric: 'views', range: 'aug13' };
const filtered = () => posts.filter((p) => p.day && p.day >= state.from && p.day <= state.to && (state.platform === 'all' || p.platform === state.platform) && (state.source === 'all' || p.source === state.source));
const platformsIn = () => state.platform === 'all' ? ['instagram', 'tiktok'] : [state.platform];

// ---------- tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.replaceChildren(html); tip.style.display = 'block'; moveTip(ev); }
function moveTip(ev) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.style.display = 'none'; }
function tipBox(title, rows, img) {
  const b = el('div'); if (img) b.append(el('img', { src: img, alt: '' })); b.append(el('div', { class: 't' }, title));
  for (const r of rows) b.append(el('div', { class: 'row' }, el('span', { class: 'k' }, r.color ? el('i', { style: `background:${r.color}` }) : null, r.k), el('b', {}, r.v)));
  return b;
}
function bindTip(node, fn) { node.addEventListener('pointerenter', (e) => showTip(e, fn())); node.addEventListener('pointermove', moveTip); node.addEventListener('pointerleave', hideTip); node.setAttribute('tabindex', '0'); node.addEventListener('focus', (e) => { const r = node.getBoundingClientRect(); showTip({ clientX: r.left + r.width / 2, clientY: r.top }, fn()); }); node.addEventListener('blur', hideTip); }

// ---------- scales & axes
const lin = (d0, d1, r0, r1) => { const f = (v) => d1 === d0 ? (r0 + r1) / 2 : r0 + (v - d0) / (d1 - d0) * (r1 - r0); f.domain = [d0, d1]; f.ticks = (n = 5) => niceTicks(d0, d1, n); return f; };
const logs = (d0, d1, r0, r1) => { const l0 = Math.floor(Math.log10(Math.max(d0, 1))), l1 = Math.ceil(Math.log10(Math.max(d1, 10)) - 1e-9); const f = (v) => r0 + (Math.log10(Math.max(v, 1)) - l0) / (l1 - l0) * (r1 - r0); f.domain = [d0, d1]; f.ticks = () => { const t = []; for (let e = Math.floor(l0); e <= Math.ceil(l1); e++) t.push(10 ** e); return t; }; f.log = true; return f; };
function niceTicks(a, b, n) { if (a === b) return [a]; const span = b - a, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), r = step0 / mag; const step = (r >= 5 ? 5 : r >= 2 ? 2 : 1) * mag; const t = []; for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) t.push(+v.toFixed(10)); return t; }
function niceMax(v) { if (v <= 0) return 1; const t = niceTicks(0, v, 5); const last = t[t.length - 1]; return last >= v ? last : last + (t[1] - t[0]); }

function frame(W, H, m) {
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const g = sv('g', { transform: `translate(${m.l},${m.t})` });
  svg.append(g);
  return { svg, g, w: W - m.l - m.r, h: H - m.t - m.b };
}
function yAxis(g, y, w, fmtFn = compact, n = 5) {
  const grid = sv('g', { class: 'grid' }), ax = sv('g', { class: 'axis' });
  for (const t of y.ticks(n)) { const yy = y(t); grid.append(sv('line', { x1: 0, x2: w, y1: yy, y2: yy })); ax.append(sv('text', { x: -8, y: yy + 4, 'text-anchor': 'end' }, fmtFn(t))); }
  g.append(grid, ax);
}
function xAxisBand(g, labels, x, h, every = 1) {
  const ax = sv('g', { class: 'axis' });
  ax.append(sv('line', { x1: 0, x2: x.range, y1: h, y2: h }));
  labels.forEach((l, i) => { if (i % every === 0) ax.append(sv('text', { x: x(i) + x.bw / 2, y: h + 16, 'text-anchor': 'middle' }, l)); });
  g.append(ax);
}
function xAxisLin(g, x, h, fmtFn = compact) {
  const ax = sv('g', { class: 'axis' });
  ax.append(sv('line', { x1: 0, x2: x(x.domain[1]), y1: h, y2: h }));
  for (const t of x.ticks()) ax.append(sv('text', { x: x(t), y: h + 16, 'text-anchor': 'middle' }, fmtFn(t)));
  g.append(ax);
}
const band = (n, range, pad = 0.25) => { const step = range / Math.max(n, 1); const bw = Math.min(step * (1 - pad), 24); const f = (i) => i * step + (step - bw) / 2; f.bw = bw; f.step = step; f.range = range; return f; };

// ---------- chart builders (each returns {node, table:{cols, rows}})
function stackedColumns({ keys, series, colors, names, W = 640, H = 240, fmtFn = compact, tipTitle = (k) => k, everyLabel, labelFn = (k) => k, thumbs }) {
  // series: {name: [values per key]}
  const f = frame(W, H, { l: 44, r: 8, t: 8, b: 26 });
  const totals = keys.map((_, i) => Object.values(series).reduce((s, arr) => s + (arr[i] ?? 0), 0));
  const y = lin(0, niceMax(Math.max(...totals, 1)), f.h, 0);
  const x = band(keys.length, f.w, 0.3);
  yAxis(f.g, y, f.w, fmtFn);
  xAxisBand(f.g, keys.map(labelFn), x, f.h, everyLabel ?? Math.ceil(keys.length / 10));
  const sNames = Object.keys(series);
  keys.forEach((k, i) => {
    let acc = 0; const grp = sv('g');
    sNames.forEach((s, si) => {
      const v = series[s][i] ?? 0; if (!v) return;
      const y1 = y(acc + v), y0 = y(acc); const gap = si > 0 && acc > 0 ? 2 : 0;
      const h = Math.max(y0 - y1 - gap, 0);
      const isTop = si === sNames.length - 1 || sNames.slice(si + 1).every((s2) => !(series[s2][i]));
      const r = isTop ? 4 : 0;
      const path = `M${x(i)},${y0 - gap} v${-(h - r)} a${r},${r} 0 0 1 ${r},${-r} h${x.bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} z`;
      grp.append(sv('path', { d: path, fill: colors[s], class: 'mark' }));
      acc += v;
    });
    const hit = sv('rect', { x: x(i), y: 0, width: x.bw, height: f.h, class: 'hit' });
    bindTip(hit, () => tipBox(tipTitle(k, i), sNames.map((s) => ({ k: names?.[s] ?? s, v: fmtFn(series[s][i] ?? 0), color: colors[s] })).concat(sNames.length > 1 ? [{ k: 'Total', v: fmtFn(totals[i]) }] : []), thumbs?.(k, i)));
    grp.append(hit); f.g.append(grp);
  });
  return { node: f.svg, table: { cols: ['Key', ...sNames.map((s) => names?.[s] ?? s)], rows: keys.map((k, i) => [labelFn(k), ...sNames.map((s) => series[s][i] ?? 0)]) } };
}
function hbars({ items, W = 640, rowH = 22, fmtFn = compact, color = 'var(--ig)', colorFn, labelW = 150, onClick, tipFn, maxLabel = 24 }) {
  const H = items.length * rowH + 6;
  const f = frame(W, H, { l: labelW, r: 60, t: 2, b: 2 });
  const max = Math.max(...items.map((d) => d.value), 1);
  const x = lin(0, max, 0, f.w);
  items.forEach((d, i) => {
    const y = i * rowH + 3, bh = Math.min(rowH - 6, 18);
    const w = Math.max(x(d.value), 0), r = Math.min(4, w / 2);

  if (!pairs.length) return { node: el('div', { class: 'empty' }, 'No cross-posted pairs in range'), table: { cols: [], rows: [] } };
  const all = pairs.flatMap((g) => [g.instagram.v.views, g.tiktok.v.views]).filter((v) => v > 0);
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = logs(lo, hi, 0, f.w), y = logs(lo, hi, f.h, 0);
  yAxis(f.g, y, f.w); const ax = sv('g', { class: 'axis' }); ax.append(sv('line', { x1: 0, x2: f.w, y1: f.h, y2: f.h })); for (const t of x.ticks()) ax.append(sv('text', { x: x(t), y: f.h + 16, 'text-anchor': 'middle' }, compact(t))); f.g.append(ax);
  f.g.append(sv('line', { x1: x(lo), y1: y(lo), x2: x(hi), y2: y(hi), stroke: 'var(--axis)', 'stroke-width': 1 }));
  f.g.append(sv('text', { x: f.w / 2, y: f.h + 30, 'text-anchor': 'middle' }, 'Instagram views'));
  f.g.append(sv('text', { transform: `translate(-38,${f.h / 2}) rotate(-90)`, 'text-anchor': 'middle' }, 'TikTok views'));
  for (const g of pairs) { const a = g.instagram, b = g.tiktok; f.g.append(sv('circle', { cx: x(a.v.views), cy: y(b.v.views), r: 4.5, fill: 'var(--s3)', stroke: 'var(--surface)', 'stroke-width': 2, class: 'mark' })); const hit = sv('circle', { cx: x(a.v.views), cy: y(b.v.views), r: 12, class: 'hit', style: 'cursor:pointer' }); bindTip(hit, () => tipBox(a.content || '(no caption)', [{ k: 'Instagram', v: fmt(a.v.views), color: colors.instagram }, { k: 'TikTok', v: fmt(b.v.views), color: colors.tiktok }, { k: 'IG ÷ TT', v: (a.v.views / Math.max(b.v.views, 1)).toFixed(1) + '×' }], a.thumbnailUrl)); hit.addEventListener('click', () => openDetail(a)); f.g.append(hit); }
  return { node: f.svg, table: { cols: ['Caption', 'Instagram views', 'TikTok views'], rows: pairs.map((g) => [g.instagram.content, g.instagram.v.views, g.tiktok.v.views]) } };
} }));
add(card({ title: 'Side by side, top cross-posts', w: 6, desc: 'Blue = Instagram, orange = TikTok, sorted by combined views. Log scale.', legend: [{ name: 'Instagram', color: 'var(--ig)' }, { name: 'TikTok', color: 'var(--tt)' }], build: () => {
  const pairs = [...zernioGroups.values()].filter((g) => g.instagram && g.tiktok && g.instagram.day >= state.from && g.instagram.day <= state.to).sort((a, b) => (b.instagram.v.views + b.tiktok.v.views) - (a.instagram.v.views + a.tiktok.v.views)).slice(0, 14);
  if (!pairs.length) return { node: el('div', { class: 'empty' }, 'No cross-posted pairs in range'), table: { cols: [], rows: [] } };
  return dumbbell({ items: pairs.map((g) => ({ label: g.instagram.content || '(no caption)', a: Math.max(g.instagram.v.views, 1), b: Math.max(g.tiktok.v.views, 1), img: g.instagram.thumbnailUrl, post: g.instagram })), aName: 'Instagram', bName: 'TikTok', aColor: colors.instagram, bColor: colors.tiktok, onClick: (d) => openDetail(d.post) });
} }));
add(card({ title: 'Cross-post summary', w: 12, build: () => {
  const pairs = [...zernioGroups.values()].filter((g) => g.instagram && g.tiktok && g.instagram.day >= state.from && g.instagram.day <= state.to);
  const ig = pairs.map((g) => g.instagram.v.views), tt = pairs.map((g) => g.tiktok.v.views);
  const ttWins = pairs.filter((g) => g.tiktok.v.views > g.instagram.v.views).length;
  const igOnly = filtered().filter((p) => p.platform === 'instagram' && !(zernioGroups.get(p.zernioPostId)?.tiktok)).map((p) => p.v.views);
  const ttOnly = filtered().filter((p) => p.platform === 'tiktok' && !(zernioGroups.get(p.zernioPostId)?.instagram)).map((p) => p.v.views);
  const rows = [['Cross-posted videos in range', pairs.length], ['Median Instagram views (cross-posted)', median(ig)], ['Median TikTok views (cross-posted)', median(tt)], ['Median IG ÷ TT ratio', median(pairs.map((g) => g.instagram.v.views / Math.max(g.tiktok.v.views, 1)))], ['Videos where TikTok beat Instagram', `${ttWins} of ${pairs.length}`], ['Median views, Instagram-only posts', median(igOnly)], ['Median views, TikTok-only posts', median(ttOnly)]];
  return { node: el('div', { class: 'kpis', style: 'grid-template-columns: repeat(auto-fit, minmax(160px, 1fr))' }, rows.map(([l, v]) => el('div', { class: 'tile' }, el('div', { class: 'l' }, l), el('div', { class: 'v', style: 'font-size:22px' }, typeof v === 'number' ? fmt(v, 1) : v ?? '–')))), table: { cols: ['Stat', 'Value'], rows } };
} }));

// --- Momentum
group('Momentum (last 7 days)', 'Zernio began daily snapshots on 2026-09-05, so "gained" means between the first and latest snapshot for each post.');
add(card({ title: 'Views gained in the snapshot window', w: 6, desc: 'Which posts are still moving. Top 15 in range.', build: () => {
  const ps = filtered().filter((p) => p.gain7).sort((a, b) => b.gain7.views - a.gain7.views).slice(0, 15);
  if (!ps.length) return { node: el('div', { class: 'empty' }, 'No snapshot data in range'), table: { cols: [], rows: [] } };
  return hbars({ items: ps.map((p) => ({ label: p.content || '(no caption)', value: p.gain7.views, post: p })), colorFn: (d) => colors[d.post.platform], onClick: (d) => openDetail(d.post), tipFn: (d) => postTip(d.post, [{ k: 'Views gained', v: '+' + fmt(d.post.gain7.views) }, { k: 'Likes gained', v: '+' + fmt(d.post.gain7.likes) }]), labelW: 180 });
} }));
add(card({ title: 'Daily views, top 8 movers', w: 6, desc: 'Small multiples: cumulative views per snapshot day for the posts gaining the most. Each panel has its own scale.', build: () => {
  const ps = filtered().filter((p) => p.gain7 && p.timeline.length > 2).sort((a, b) => b.gain7.views - a.gain7.views).slice(0, 8);
  if (!ps.length) return { node: el('div', { class: 'empty' }, 'No snapshot data in range'), table: { cols: [], rows: [] } };
  const grid = el('div', { style: 'display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px 16px' });
  for (const p of ps) {
    const tl = p.timeline;
    const panel = el('div', { style: 'cursor:pointer', onclick: () => openDetail(p) },
      el('div', { class: 'desc', style: 'display:flex; justify-content:space-between; gap:8px' }, el('span', { style: 'overflow:hidden; text-overflow:ellipsis; white-space:nowrap' }, el('i', { style: `display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${colors[p.platform]}` }), p.content || '(no caption)'), el('span', { style: 'white-space:nowrap' }, '+' + compact(p.gain7.views))),
      lines({ xs: tl.map((t) => t.date), series: { v: tl.map((t) => t.views) }, colors: { v: colors[p.platform] }, names: { v: 'Views' }, W: 300, H: 90, xLabel: (d) => d.slice(5), labelEvery: 99, yTicks: 2, fixedWidth: true }).node);
    grid.append(panel);
  }
  return { node: grid, table: { cols: ['Post', 'First snapshot', 'Latest', 'Gained'], rows: ps.map((p) => [p.content, p.timeline[0].views, p.timeline[p.timeline.length - 1].views, p.gain7.views]) } };
} }));

// --- Account
group('Account level', 'From Zernio\'s account-insight endpoints. Not affected by the post filters except where noted.');
add(card({ title: 'Instagram daily reach (account level)', w: 8, desc: 'Accounts reached per day across all surfaces, last 88 days. Data may lag up to 48h.', build: () => {
  const ig = Object.values(D.instagram)[0]; const vals = ig?.reachSeries?.metrics?.reach?.values ?? [];
  return lines({ xs: vals.map((v) => v.date), series: { reach: vals.map((v) => v.value) }, colors: { reach: colors.instagram }, names: { reach: 'Reach' }, W: 860, H: 240, xLabel: (d) => shortDate(d + 'T12:00:00'), area: true });
} }));
add(card({ title: 'Instagram, last 88 days', w: 4, build: () => {
  const ig = Object.values(D.instagram)[0]; const m = ig?.totals?.metrics ?? {};
  const rows = [['Reach', m.reach?.total], ['Views', m.views?.total], ['Accounts engaged', m.accounts_engaged?.total], ['Total interactions', m.total_interactions?.total], ['Likes', m.likes?.total], ['Comments', m.comments?.total], ['Saves', m.saves?.total], ['Shares', m.shares?.total], ['Reposts', m.reposts?.total]];
  const ft = ig?.byFollowType?.metrics?.reach?.breakdowns ?? []; const nf = ft.find((b) => b.dimension === 'NON_FOLLOWER')?.value, fo = ft.find((b) => b.dimension === 'FOLLOWER')?.value;
  if (nf != null) rows.push(['Reach from non-followers', `${(nf / (nf + fo) * 100).toFixed(1)}%`]);
  return { node: el('div', { class: 'kpis', style: 'grid-template-columns: 1fr 1fr' }, rows.map(([l, v]) => el('div', { class: 'tile', style: 'padding:8px 10px' }, el('div', { class: 'l' }, l), el('div', { class: 'v', style: 'font-size:18px' }, typeof v === 'number' ? compact(v) : v ?? '–')))), table: { cols: ['Metric', 'Value'], rows } };
} }));
add(card({ title: 'Followers, daily', w: 6, desc: 'Both accounts. Separate scales would mislead, so each is indexed: change since the first snapshot.', legend: legendPT(), build: () => {
  const st = D.followerStats.daily.stats; const ids = Object.fromEntries(D.accounts.map((a) => [a.platform, a.id]));
  const days = [...new Set(Object.values(st).flat().map((x) => x.date))].sort();
  const series = {}; for (const pl of platformsIn()) { const arr = st[ids[pl]] ?? []; const base = arr[0]?.followers ?? 0; series[pl] = days.map((d) => { const r = arr.find((x) => x.date === d); return r ? r.followers - base : null; }); }
  return lines({ xs: days, series, colors, names, H: 220, xLabel: (d) => shortDate(d + 'T12:00:00'), labelEvery: 1, dots: true, fmtFn: (v) => v == null ? '–' : (v >= 0 ? '+' : '') + fmt(v) });
} }));
add(card({ title: 'Instagram followers gained per day', w: 6, legend: [], build: () => {
  const ig = Object.values(D.instagram)[0]; const g = ig?.followerHistory?.metrics?.followers_gained?.values ?? []; const l = ig?.followerHistory?.metrics?.followers_lost?.values ?? [];
  const days = g.map((v) => v.date);
  return stackedColumns({ keys: days, series: { gained: g.map((v) => v.value) }, colors: { gained: colors.instagram }, names: { gained: 'Gained' }, H: 220, fmtFn: (v) => fmt(v), labelFn: (d) => shortDate(d + 'T12:00:00'), everyLabel: 1, tipTitle: (d, i) => `${shortDate(d + 'T12:00:00')} · lost ${l[i]?.value ?? 0}` });
} }));
add(card({ title: 'TikTok account counters, daily', w: 6, desc: 'Lifetime likes on the account and follower count, from Zernio snapshots. Indexed to first snapshot.', legend: [{ name: 'Likes', color: 'var(--tt)' }, { name: 'Followers', color: 'var(--s4)' }], build: () => {
  const tt = Object.values(D.tiktok)[0]?.series?.metrics ?? {}; const lk = tt.likes_count?.values ?? [], fl = tt.follower_count?.values ?? [];
  const days = lk.map((v) => v.date);
  return lines({ xs: days, series: { likes: lk.map((v) => v.value - lk[0].value), followers: fl.map((v) => v.value - fl[0].value) }, colors: { likes: colors.tiktok, followers: 'var(--s4)' }, names: { likes: 'Likes gained', followers: 'Followers gained' }, H: 220, xLabel: (d) => shortDate(d + 'T12:00:00'), labelEvery: 1, dots: true, fmtFn: (v) => v == null ? '–' : '+' + fmt(v) });
} }));
add(card({ title: 'Instagram reach by content type (88d)', w: 6, build: () => {
  const ig = Object.values(D.instagram)[0]; const b = ig?.byMediaType?.metrics?.reach?.breakdowns ?? [];
  return hbars({ items: b.map((x) => ({ label: x.dimension, value: x.value })), labelW: 90, W: 640, rowH: 28 });
} }));

// --- Audience
group('Audience', 'Instagram follower demographics (this month). TikTok exposes no demographics via its public API, and Zernio returned an empty engaged-audience breakdown for this account.');
const demoCard = (title, dim, w, top) => add(card({ title, w, build: () => {
  const ig = Object.values(D.instagram)[0]; const arr = [...(ig?.followerDemographics?.demographics?.[dim] ?? [])].sort((a, b) => dim === 'age' ? a.dimension.localeCompare(b.dimension, undefined, { numeric: true }) : b.value - a.value).slice(0, top ?? 99);
  const total = (ig?.followerDemographics?.demographics?.[dim] ?? []).reduce((s, x) => s + x.value, 0) || 1;
  const labels = { M: 'Men', F: 'Women', U: 'Unknown' };
  return hbars({ items: arr.map((x) => ({ label: labels[x.dimension] ?? x.dimension, value: x.value })), labelW: 110, W: w === 3 ? 320 : 640, rowH: 24, fmtFn: (v) => `${fmt(v)} (${(v / total * 100).toFixed(0)}%)`, maxLabel: 18 });
} }));
demoCard('Followers by age', 'age', 3); demoCard('Followers by gender', 'gender', 3); demoCard('Top countries', 'country', 3, 12); demoCard('Top cities', 'city', 3, 12);
// --- Content
group('Content', 'Words in captions vs performance, and Zernio\'s content-lifecycle models.');
add(card({ title: '', w: 6, desc: 'Caption words appearing in at least 3 posts, ranked by average of the selected metric. Top 15.', build: () => {
  const ps = filtered(); const stop = new Set('the a an and or of to in on for is it my i you this that with be are was as at by from but not so if we they your its just like about have has do what how why can will'.split(' '));
  const map = new Map();
  for (const p of ps) for (const w of new Set((p.content || '').toLowerCase().replace(/[^a-z0-9#' ]/g, ' ').split(/\s+/).filter((w) => w.length > 2 && !stop.has(w)))) { const e = map.get(w) ?? { n: 0, sum: 0 }; e.n++; e.sum += mval(p) ?? 0; map.set(w, e); }
  const items = [...map].filter(([, e]) => e.n >= 3).map(([w, e]) => ({ label: `${w} (${e.n})`, value: e.sum / e.n })).sort((a, b) => b.value - a.value).slice(0, 15);
  if (!items.length) return { node: el('div', { class: 'empty' }, 'Not enough repeated words in range'), table: { cols: [], rows: [] } };
  return hbars({ items, labelW: 130 });
} })).querySelector('h3').dataset.metricTitle = 'by caption word';
add(card({ title: 'Caption length buckets', w: 6, desc: 'Average of the selected metric by caption length. Count in parentheses.', build: () => {
  const ps = filtered(); const buckets = [[0, 0, 'empty'], [1, 20, '1–20'], [21, 50, '21–50'], [51, 100, '51–100'], [101, 200, '101–200'], [201, 1e9, '200+']];
  const items = buckets.map(([lo, hi, l]) => { const g = ps.filter((p) => p.contentLength >= lo && p.contentLength <= hi); return { label: `${l} chars (${g.length})`, value: g.length ? mean(g.map((p) => mval(p) ?? 0)) : 0 }; });
  return hbars({ items, labelW: 130, rowH: 28 });
} }));
add(card({ title: 'How fast engagement arrives', w: 6, desc: 'Zernio content-decay model: share of a post\'s final engagement reached by each age. All history.', build: () => {
  const key = state.platform === 'all' ? 'content_decay_all' : `content_decay_${state.platform}`; const b = D.aggregates[key]?.buckets ?? [];
  return lines({ xs: b.map((x) => x.bucket_label), series: { pct: b.map((x) => x.avg_pct_of_final) }, colors: { pct: colors[state.platform === 'tiktok' ? 'tiktok' : 'instagram'] }, names: { pct: '% of final engagement' }, H: 220, xLabel: (v) => v, labelEvery: 1, dots: true, fmtFn: (v) => v == null ? '–' : v.toFixed(0) + '%', area: true });
} }));
add(card({ title: 'Posting frequency vs engagement rate', w: 6, desc: 'Zernio model: average engagement rate for weeks with N posts on that platform. Dots = platform.', legend: [{ name: 'Instagram', color: 'var(--ig)' }, { name: 'TikTok', color: 'var(--tt)' }], build: () => {
  const f = D.aggregates.posting_frequency_all?.frequency ?? [];
  return scatter({ pts: f.filter((r) => state.platform === 'all' || r.platform === state.platform).map((r) => ({ x: r.posts_per_week, y: r.avg_engagement_rate, color: colors[r.platform], label: `${names[r.platform]} · ${r.posts_per_week} posts/week`, sub: [{ k: 'Weeks observed', v: r.weeks_count }, { k: 'Avg engagement', v: fmt(r.avg_engagement) }] })), xLabel: 'Posts per week', yLabel: 'Avg engagement rate %', fmtX: (v) => fmt(v), fmtY: (v) => fmt(v, 1), H: 220 });
} }));
add(card({ title: 'Instagram: average watch time vs duration', w: 6, desc: 'Each dot is a reel. The diagonal is 100% retention. Dots on the line are watched to the end (or looped).', legend: [{ name: 'Reel', color: 'var(--ig)' }], build: () => {
  const ps = filtered().filter((p) => p.platform === 'instagram' && p.metrics.videoDurationSeconds && p.metrics.igReelsAvgWatchTime);
  const f = frame(640, 260, { l: 48, r: 12, t: 8, b: 34 });
  if (!ps.length) return { node: el('div', { class: 'empty' }, 'No Instagram reels in range'), table: { cols: [], rows: [] } };
  const maxD = niceMax(Math.max(...ps.map((p) => p.metrics.videoDurationSeconds))); const x = lin(0, maxD, 0, f.w), y = lin(0, maxD, f.h, 0);
  yAxis(f.g, y, f.w, (v) => v + 's'); xAxisLin(f.g, x, f.h, (v) => v + 's');
  f.g.append(sv('line', { x1: 0, y1: f.h, x2: x(maxD), y2: y(maxD), stroke: 'var(--axis)' }));
  f.g.append(sv('text', { x: f.w / 2, y: f.h + 30, 'text-anchor': 'middle' }, 'Duration')); f.g.append(sv('text', { transform: `translate(-38,${f.h / 2}) rotate(-90)`, 'text-anchor': 'middle' }, 'Avg watch time'));
  for (const p of ps) { const cx = x(p.metrics.videoDurationSeconds), cy = y(p.metrics.igReelsAvgWatchTime / 1000); f.g.append(sv('circle', { cx, cy, r: 4.5, fill: colors.instagram, stroke: 'var(--surface)', 'stroke-width': 2, class: 'mark' })); const hit = sv('circle', { cx, cy, r: 12, class: 'hit', style: 'cursor:pointer' }); bindTip(hit, () => postTip(p, [{ k: 'Duration', v: p.metrics.videoDurationSeconds + 's' }, { k: 'Avg watch', v: (p.metrics.igReelsAvgWatchTime / 1000).toFixed(1) + 's' }, { k: 'Retention', v: (p.retention * 100).toFixed(0) + '%' }])); hit.addEventListener('click', () => openDetail(p)); f.g.append(hit); }
  return { node: f.svg, table: { cols: ['Caption', 'Duration s', 'Avg watch s'], rows: ps.map((p) => [p.content, p.metrics.videoDurationSeconds, p.metrics.igReelsAvgWatchTime / 1000]) } };
} }));
add(card({ title: 'Total watch time, top reels', w: 6, desc: 'Instagram total hours watched. Views × watch time, the truest "attention" number here.', build: () => {
  const ps = filtered().filter((p) => p.metrics.igReelsVideoViewTotalTime).sort((a, b) => b.metrics.igReelsVideoViewTotalTime - a.metrics.igReelsVideoViewTotalTime).slice(0, 15);
  if (!ps.length) return { node: el('div', { class: 'empty' }, 'No Instagram reels in range'), table: { cols: [], rows: [] } };
  return hbars({ items: ps.map((p) => ({ label: p.content || '(no caption)', value: p.metrics.igReelsVideoViewTotalTime / 3.6e6, post: p })), fmtFn: (v) => fmt(v, 1) + ' h', onClick: (d) => openDetail(d.post), tipFn: (d) => postTip(d.post, [{ k: 'Watch time', v: fmt(d.value, 1) + ' hours' }]), labelW: 180 });
} }));

// ---------- refresh
function refresh() {
  rangeSeg.update(); platSeg.update(); srcSeg.update(); fromIn.value = state.from; toIn.value = state.to;
  renderKpis();
  for (const c of cards) {
    const h = c.querySelector('h3'); if (h.dataset.metricTitle) h.textContent = `${METRICS[state.metric]} ${h.dataset.metricTitle === 'cumulative' && isRate() ? 'running average' : h.dataset.metricTitle}`;
    const lg = c.querySelector('.legend'); if (lg && lg.dataset.pt !== 'fixed' && lg.childElementCount && ['Instagram', 'TikTok'].includes(lg.firstChild.textContent.trim())) { lg.replaceChildren(...legendPT().map((l) => el('span', {}, el('i', { style: `background:${l.color}` }), l.name))); }
    c.render();
  }
}
refresh();
})();
</script>
