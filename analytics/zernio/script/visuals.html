<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Script visuals</title>
<style>
  :root { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --ig:#2a78d6; --tt:#eb6834; --aqua:#1baf7a; --yellow:#eda100; --seq2:#9ec5f4; --seq4:#5598e7; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  .slide { width:1080px; height:1080px; padding:84px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between; }
  .kicker { font-size:30px; color:var(--muted); font-weight:500; letter-spacing:.01em; }
  h1 { font-size:64px; line-height:1.08; margin:14px 0 0; font-weight:700; letter-spacing:-.02em; }
  .hero { font-size:220px; font-weight:700; letter-spacing:-.05em; line-height:1; }
  .hero small { font-size:64px; color:var(--ink2); font-weight:600; letter-spacing:-.02em; margin-left:12px; }
  .sub { font-size:34px; color:var(--ink2); line-height:1.3; }
  .foot { font-size:24px; color:var(--muted); display:flex; justify-content:space-between; }
  svg { display:block; overflow:visible; font-family:inherit; }
  svg text { fill:var(--ink2); font-size:28px; }
  svg text.v { fill:var(--ink); font-weight:600; }
  svg text.m { fill:var(--muted); font-size:24px; }
  svg .grid { stroke:var(--grid); stroke-width:2; }
  .chart { flex:1; display:flex; align-items:center; }
  .bars { display:flex; flex-direction:column; gap:22px; width:100%; }
  .bar { display:flex; align-items:center; gap:20px; font-size:32px; }
  .bar .l { width:300px; text-align:right; color:var(--ink2); }
  .bar .b { height:44px; border-radius:0 8px 8px 0; background:var(--ig); }
  .bar .n { font-weight:600; font-variant-numeric: tabular-nums; }
</style></head><body><div id="root"></div>
<script src="../data/dataset.js"></script>
<script>
const slides = [
  // 1 skew
  () => `<div class="slide">
    <div><div class="kicker">87 videos, ranked by views</div><h1>The top 10 videos made 47% of all views.<br>The bottom half made 18%.</h1></div>
    <div class="chart"><svg viewBox="0 0 912 420" width="912" height="420">${window.__skew}</svg></div>
    <div class="foot"><span>Instagram, Aug 13 – Sep 10</span><span>288.8K views total</span></div></div>`,
  // 2 skip rate
  () => `<div class="slide">
    <div><div class="kicker">Median views by 3-second skip rate</div><h1>The first 3 seconds decided everything.</h1></div>
    <div class="chart"><div class="bars">${bars([['Under 35% skipped','6,644',6644],['35–45%','2,384',2384],['45–55%','1,827',1827],['Over 55% skipped','524',524]],6644)}</div></div>
    <div class="foot"><span>Skip rate = viewers who scrolled within 3s</span><span>13× gap between best and worst</span></div></div>`,
  // 3 length
  () => `<div class="slide">
    <div><div class="kicker">Median views by video length</div><h1>Longer videos won. My best length was over 90 seconds.</h1></div>
    <div class="chart"><div class="bars">${bars([['Under 30s','1,694',1694],['30–60s','1,946',1946],['60–90s','2,129',2129],['Over 90s','6,566',6566]],6566)}</div></div>
    <div class="foot"><span>Only 6 videos were over 90s</span><span>Median length: 57s</span></div></div>`,
  // 4 saves > likes
  () => `<div class="slide">
    <div><div class="kicker">Per 1,000 views</div><h1>People saved my videos more than they liked them.</h1></div>
    <div class="chart"><div class="bars">${bars([['Saves','26',25.6],['Likes','19',19.1],['Shares','11',10.9],['Comments','2',2.0]],25.6,['var(--ig)','var(--seq4)','var(--seq2)','var(--grid)'])}</div></div>
    <div class="foot"><span>7,400 saves vs 5,513 likes</span><span>1.34 saves per like</span></div></div>`,
  // 5 non-followers
  () => `<div class="slide">
    <div><div class="kicker">Where the reach came from</div><h1>Almost nobody watching was a follower.</h1></div>
    <div class="chart"><div><div class="hero">99.3<small>%</small></div><div class="sub">of accounts reached did not follow me</div></div></div>
    <div class="foot"><span>273,826 non-followers reached</span><span>1,806 followers reached</span></div></div>`,
  // 6 watch time
  () => `<div class="slide">
    <div><div class="kicker">Total watch time</div><h1>People spent 1,074 hours watching my face.</h1></div>
    <div class="chart"><div><div class="hero">45<small>days</small></div><div class="sub">of continuous watch time, from 87 videos posted in 30 days</div></div></div>
    <div class="foot"><span>Avg retention 28% · avg 15s watched per view</span><span>Instagram reels only</span></div></div>`,
  // 7 tiktok
  () => `<div class="slide">
    <div><div class="kicker">Same 60 videos, posted to both</div><h1>TikTok got crushed by Instagram on the exact same videos.</h1></div>
    <div class="chart"><div class="bars">${bars([['Instagram median','1,773',1773],['TikTok median','381',381]],1773,['var(--ig)','var(--tt)'])}</div></div>
    <div class="foot"><span>TikTok won on 5 of 60 videos</span><span>4.7× more views on Instagram</span></div></div>`,
  // 8 decay
  () => `<div class="slide">
    <div><div class="kicker">Share of a video's final engagement, by age</div><h1>A video is basically done after 24 hours.</h1></div>
    <div class="chart"><svg viewBox="0 0 912 400" width="912" height="400">${window.__decay}</svg></div>
    <div class="foot"><span>84% of engagement arrives in the first day</span><span>99% within a week</span></div></div>`,
  // 9 audience
  () => `<div class="slide">
    <div><div class="kicker">Who follows me now</div><h1>Mostly men, mostly 25 to 34, a third of them in the US and a fifth in India.</h1></div>
    <div class="chart"><div class="bars">${bars([['25–34','42%',42],['18–24','32%',32],['35–44','17%',17],['45–54','7%',7],['Other','3%',3]],42)}</div></div>
    <div class="foot"><span>74% men · 5% women · 21% unknown</span><span>US 30% · India 22% · Canada 4%</span></div></div>`,
  // 10 followers
  () => `<div class="slide">
    <div><div class="kicker">Instagram followers, last 7 days</div><h1>The growth is compounding. 246 followers in the last week alone.</h1></div>
    <div class="chart"><svg viewBox="0 0 912 400" width="912" height="400">${window.__followers}</svg></div>
    <div class="foot"><span>1,830 → 2,076</span><span>+13% in 7 days</span></div></div>`,
  // 11 headline totals
  () => `<div class="slide">
    <div><div class="kicker">30 days · 3 videos a day · 87 videos</div><h1>The scoreboard.</h1></div>
    <div class="chart"><div class="bars" style="gap:34px">${[['Views','288.8K'],['Reach','233.9K'],['Saves','7,400'],['Likes','5,513'],['Shares','3,146'],['Comments','577']].map(([l,v])=>`<div class="bar"><div class="l">${l}</div><div class="n" style="font-size:52px">${v}</div></div>`).join('')}</div></div>
    <div class="foot"><span>Instagram only</span><span>Median 2.0K views per video</span></div></div>`,
];
function bars(rows, max, colors) {
  return rows.map(([l, txt, v], i) => `<div class="bar"><div class="l">${l}</div><div class="b" style="width:${Math.max(v / max * 460, 6)}px; background:${colors ? colors[i] : 'var(--ig)'}"></div><div class="n">${txt}</div></div>`).join('');
}
// skew chart from data
const D = window.ZERNIO_DATA;
const LA = 'America/Los_Angeles';
const dayKey = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: LA, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
const ig = D.posts.filter((p) => p.platform === 'instagram' && p.publishedAt && dayKey(p.publishedAt) >= '2026-08-13').map((p) => p.metrics.views).sort((a, b) => b - a);
{
  const W = 912, H = 380, max = ig[0], n = ig.length, bw = W / n;
  let s = '';
  ig.forEach((v, i) => { const h = v / max * H; const c = i < 10 ? 'var(--ig)' : i >= Math.ceil(n / 2) ? 'var(--grid)' : 'var(--seq2)'; s += `<rect x="${i * bw + 1}" y="${H - h}" width="${bw - 2}" height="${h}" rx="3" fill="${c}"/>`; });
  s += `<text x="0" y="${H + 34}" class="m">#1 · 34.9K views</text><text x="${W}" y="${H + 34}" text-anchor="end" class="m">#87 · 116 views</text>`;
  s += `<text x="${10 * bw + 14}" y="60" class="v">top 10 = 47%</text><text x="${Math.ceil(n / 2) * bw + 14}" y="${H - 40}" class="m">bottom 44 = 18%</text>`;
  window.__skew = s;
}
{
  const pts = [[0, 0], [6, 37], [12, 63], [24, 84], [48, 93], [168, 99]];
  const W = 912, H = 320, xmax = 168;
  const x = (h) => Math.sqrt(h / xmax) * W, y = (p) => H - p / 100 * H;
  let s = `<line x1="0" x2="${W}" y1="${H}" y2="${H}" class="grid"/>`;
  s += `<path d="M${pts.map(([h, p]) => x(h) + ',' + y(p)).join('L')}" fill="none" stroke="var(--ig)" stroke-width="6" stroke-linejoin="round"/>`;
  s += `<path d="M${pts.map(([h, p]) => x(h) + ',' + y(p)).join('L')}L${W},${H}L0,${H}Z" fill="var(--ig)" opacity=".08"/>`;
  for (const [h, p] of pts) { if (!h) continue; s += `<circle cx="${x(h)}" cy="${y(p)}" r="10" fill="var(--ig)" stroke="var(--bg)" stroke-width="4"/>`; s += `<text x="${x(h)}" y="${H + 40}" text-anchor="middle" class="m">${h < 48 ? h + 'h' : h / 24 + 'd'}</text>`; s += `<text x="${x(h) + (h === 168 ? -20 : 0)}" y="${y(p) - 22}" text-anchor="${h === 168 ? 'end' : 'middle'}" class="v">${p}%</text>`; }
  window.__decay = s;
}
{
  const f = [1830, 1855, 1871, 1923, 1973, 2021, 2076], labels = ['Sep 5', '6', '7', '8', '9', '10', '11'];
  const W = 912, H = 320, lo = 1800, hi = 2100;
  const x = (i) => i / 6 * (W - 120), y = (v) => H - (v - lo) / (hi - lo) * H;
  let s = '';
  for (const g of [1800, 1900, 2000, 2100]) s += `<line x1="0" x2="${W - 120}" y1="${y(g)}" y2="${y(g)}" class="grid"/><text x="${W - 100}" y="${y(g) + 10}" class="m">${g.toLocaleString()}</text>`;
  s += `<path d="M${f.map((v, i) => x(i) + ',' + y(v)).join('L')}" fill="none" stroke="var(--ig)" stroke-width="6" stroke-linejoin="round"/>`;
  f.forEach((v, i) => { s += `<circle cx="${x(i)}" cy="${y(v)}" r="10" fill="var(--ig)" stroke="var(--bg)" stroke-width="4"/><text x="${x(i)}" y="${H + 40}" text-anchor="middle" class="m">${labels[i]}</text>`; });
  s += `<text x="${x(6)}" y="${y(f[6]) - 24}" text-anchor="end" class="v">2,076</text><text x="${x(0)}" y="${y(f[0]) + 44}" class="v">1,830</text>`;
  window.__followers = s;
}
const i = Number(new URLSearchParams(location.search).get('slide') ?? 0);
document.getElementById('root').innerHTML = slides[i]();
</script>
</body></html>
